# Redeploys the online room server (Cloudflare Worker) when the server or the shared game logic changes.
# The websites (GitHub Pages, Vercel) deploy themselves on every push; this keeps the server's rules in step.
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Deploy room server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'js/data.js'
      - 'js/engine.js'
      - 'js/game.js'
      - 'js/bots.js'
      - 'js/flow.js'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install server dependencies
        working-directory: server
        run: npm ci --no-audit --no-fund
      - name: Test game flow and rooms
        run: |
          node tests/flow_test.js 8
          node tests/room_test.js
      - name: Deploy to Cloudflare
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - name: Check the server answers
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://pac-rooms.pac-rooms.workers.dev/health; then exit 0; fi
            sleep 5
          done
          exit 1
